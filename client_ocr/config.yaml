# Options: General, KTP, KK, NPWP, Invoice, Quotation
document_type: "Invoice"

fields:
  - invoice_date
  - invoice_number
  - total_amount
  - sales_order
  - remark

prompt: client_ocr/invoice_prompt.txt

dpi_pdf: 300  # 300 recommended for best OCR quality with text

